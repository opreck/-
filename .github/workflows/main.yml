name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          echo "runner ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/runner-nopasswd
          
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb &
          wget -q "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -O vscode.deb &
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb &
          
          sudo apt-get update -qq
          
          sudo apt-get install -y -qq --no-install-recommends \
            gnome-session \
            gnome-shell \
            gnome-terminal \
            gnome-software \
            nautilus \
            dbus-x11 \
            ubuntu-wallpapers-jammy \
            yaru-theme-gtk \
            yaru-theme-icon \
            htop \
            curl \
            unzip \
            vlc
            
          wait
          sudo dpkg -i *.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f *.deb

          WALLPAPER="/usr/share/backgrounds/ubuntu-wallpapers/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png"

          sudo mkdir -p /etc/dconf/profile
          sudo bash -c 'cat << EOF > /etc/dconf/profile/user
          user-db:user
          system-db:local
          EOF'

          sudo mkdir -p /etc/dconf/db/local.d
          sudo bash -c "cat << EOF > /etc/dconf/db/local.d/00-wallpaper
          [org/gnome/desktop/background]
          picture-uri='file://${WALLPAPER}'
          picture-uri-dark='file://${WALLPAPER}'
          picture-options='zoom'
          primary-color='rgb(48,10,36)'

          [org/gnome/desktop/interface]
          gtk-theme='Yaru-dark'
          color-scheme='prefer-dark'
          EOF"

          sudo dconf update

          mkdir -p ~/.config/autostart
          cat << EOF > ~/.config/autostart/set-wallpaper.desktop
          [Desktop Entry]
          Type=Application
          Name=Set Wallpaper
          Exec=bash -c "sleep 3 && gsettings set org.gnome.desktop.background picture-uri 'file://${WALLPAPER}' && gsettings set org.gnome.desktop.background picture-uri-dark 'file://${WALLPAPER}'"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF

          sudo bash -c 'echo "exec /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"
            
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true

      - name: Keep 
        run: |
          sleep 21600
          
