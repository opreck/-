name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          
          sudo apt-get install -y -qq \
            ubuntu-desktop-minimal \
            gnome-terminal \
            nautilus \
            dbus-x11 \
            rclone \
            htop \
            curl \
            unzip \
            vlc \
            yaru-theme-gtk \
            yaru-theme-icon \
            yaru-theme-sound \
            ubuntu-wallpapers-jammy
          
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg -i chrome-remote-desktop_current_amd64.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f chrome-remote-desktop_current_amd64.deb
          
          wget -q "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -O vscode.deb
          sudo dpkg -i vscode.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f vscode.deb
          
          sudo bash -c 'echo "exec /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'

          gsettings set org.gnome.desktop.interface gtk-theme 'Yaru' || true
          gsettings set org.gnome.desktop.interface icon-theme 'Yaru' || true
          gsettings set org.gnome.desktop.interface cursor-theme 'Yaru' || true
          
          gsettings set org.gnome.desktop.background picture-uri "file:///usr/share/backgrounds/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png" || true
          gsettings set org.gnome.desktop.background picture-uri-dark "file:///usr/share/backgrounds/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png" || true
          gsettings set org.gnome.desktop.background picture-options 'zoom' || true

          gnome-extensions enable ubuntu-dock@ubuntu.com || true
          gsettings set org.gnome.shell.extensions.dash-to-dock dock-position 'LEFT' || true
          gsettings set org.gnome.shell.extensions.dash-to-dock extend-height true || true
          gsettings set org.gnome.shell.extensions.dash-to-dock dock-fixed true || true
          gsettings set org.gnome.shell.extensions.dash-to-dock dash-max-icon-size 48 || true

      - name: Re-
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF
          
          rclone copy gdrive:CRD_Full_Backup/HomeDir /home/runner/ \
            --links \
            --transfers 16 \
            --checkers 32 \
            --drive-chunk-size 64M \
            --fast-list || true

          rm -rf ~/.dbus ~/.ICEauthority ~/.Xauthority ~/.cache ~/.local/share/trash
          rm -rf ~/.config/google-chrome/Singleton* ~/.config/google-chrome/Running*

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"
            
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true

      - name: Keep
        run: |
          sleep 19800

      - name: Back
        if: always()
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF
          
          rclone sync /home/runner/ gdrive:CRD_Full_Backup/HomeDir \
            --links \
            --transfers 16 \
            --checkers 32 \
            --drive-chunk-size 64M \
            --fast-list \
            --exclude ".config/rclone/**" \
            --exclude ".cache/**" \
            --exclude ".dbus/**" \
            --exclude ".local/share/trash/**" \
            --exclude ".ICEauthority" \
            --exclude ".Xauthority" \
            --exclude ".gnupg/**"
            
