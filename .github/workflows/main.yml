name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: setup
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-base xfce4 xfce4-terminal xscreensaver rclone htop curl unzip vlc
          
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg -i chrome-remote-desktop_current_amd64.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f chrome-remote-desktop_current_amd64.deb
          
          wget -q "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -O vscode.deb
          sudo dpkg -i vscode.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f vscode.deb
          
          sudo bash -c 'echo "exec /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

      - name: Data
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF
          
          
          rclone copy gdrive:CRD_Full_Backup/HomeDir /home/runner/ \
            --links \
            --transfers 16 \
            --checkers 32 \
            --drive-chunk-size 64M || true

          # (socket) Terminal, XFCE & Chrome no locked/crash
          rm -rf ~/.dbus ~/.ICEauthority ~/.Xauthority ~/.config/google-chrome/Singleton* ~/.config/google-chrome/Running*

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"

      - name: Keep Alive
        run: |
          sleep 19800

      - name: Data
        if: always()
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF
          
          
          rclone sync /home/runner/ gdrive:CRD_Full_Backup/HomeDir \
            --links \
            --transfers 16 \
            --checkers 32 \
            --drive-chunk-size 64M \
            --exclude ".config/rclone/**" \
            --exclude ".dbus/**" \
            --exclude ".ICEauthority" \
            --exclude ".Xauthority"
