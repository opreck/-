name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    steps:
      - name: setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive

          sudo systemctl stop gdm3 snapd || true
          sudo systemctl disable gdm3 snapd || true

          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner
          echo "runner:" | sudo chpasswd -e || true

          sudo apt-get update -qq

          sudo apt-get install -y -qq --no-install-recommends \
            gnome-session \
            gnome-shell \
            gnome-terminal \
            gnome-software \
            synaptic \
            yaru-theme-gtk \
            yaru-theme-icon \
            curl \
            unzip

          curl -sL "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -o vscode.deb &
          curl -sL "https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb" -o crd.deb &
          curl -sL "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" -o chrome.deb &
          wait

          sudo dpkg -i vscode.deb crd.deb chrome.deb || sudo apt-get install -f -y -qq
          rm -f vscode.deb crd.deb chrome.deb

          sudo bash -c 'echo "exec /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'

          sudo mkdir -p /etc/polkit-1/rules.d/
          cat << 'EOF' | sudo tee /etc/polkit-1/rules.d/49-nopasswd-global.rules
          polkit.addRule(function(action, subject) {
              return polkit.Result.YES;
          });
          EOF
          sudo chmod 777 /etc/polkit-1/rules.d/49-nopasswd-global.rules

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"

      - name: Keep
        run: |
          sleep 21600
          
