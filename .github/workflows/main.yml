name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    steps:
      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          sudo systemctl stop gdm3 snapd || true
          sudo systemctl disable gdm3 snapd || true

          sudo apt-get update -qq

          sudo apt-get install -y -qq --no-install-recommends \
            gnome-session \
            gnome-shell \
            ubuntu-session \
            gnome-shell-extension-ubuntu-dock \
            ubuntu-wallpapers \
            ubuntu-wallpapers-jammy \
            yaru-theme-gtk \
            yaru-theme-icon \
            gnome-terminal \
            gnome-software \
            synaptic \
            screenfetch \
            xvfb \
            x11-xserver-utils \
            curl \
            unzip

          curl -sL "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -o vscode.deb &
          curl -sL "https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb" -o crd.deb &
          curl -sL "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" -o chrome.deb &
          wait

          sudo dpkg -i vscode.deb crd.deb chrome.deb || sudo apt-get install -f -y -qq
          rm -f vscode.deb crd.deb chrome.deb

          sudo bash -c 'echo "exec /usr/bin/gnome-session --session=ubuntu" > /etc/chrome-remote-desktop-session'

          sudo mkdir -p /usr/share/glib-2.0/schemas
          cat << 'EOF' | sudo tee /usr/share/glib-2.0/schemas/99_ubuntu_jammy_custom.gschema.override
          [org.gnome.desktop.background]
          picture-uri='file:///usr/share/backgrounds/ubuntu-wallpapers/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png'
          picture-uri-dark='file:///usr/share/backgrounds/ubuntu-wallpapers/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png'
          picture-options='zoom'

          [org.gnome.desktop.interface]
          color-scheme='prefer-dark'
          gtk-theme='Yaru-dark'
          icon-theme='Yaru'

          [org.gnome.shell]
          enabled-extensions=['ubuntu-dock@ubuntu.com']
          favorite-apps=['org.gnome.Nautilus.desktop', 'google-chrome.desktop', 'code.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.Software.desktop']
          welcome-dialog-last-shown-version='9999'

          [org.gnome.shell.extensions.dash-to-dock]
          dock-position='LEFT'
          extend-height=true

          [org.gnome.initial-setup]
          done-displaying=true
          EOF

          sudo glib-compile-schemas /usr/share/glib-2.0/schemas/

          mkdir -p ~/.config
          echo "yes" > ~/.config/gnome-initial-setup-done

          sudo mkdir -p /etc/polkit-1/rules.d/
          cat << 'EOF' | sudo tee /etc/polkit-1/rules.d/49-nopasswd-global.rules
          polkit.addRule(function(action, subject) {
              return polkit.Result.YES;
          });
          EOF
          sudo chmod 0755 /etc/polkit-1/rules.d/49-nopasswd-global.rules

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"
            
      - name: Keep
        run: |
          sleep 21600
          
