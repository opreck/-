name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "runner ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/runner-nopasswd
          
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb &
          wget -q "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -O vscode.deb &
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb &
          
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-session gnome-shell gnome-terminal gnome-software gnome-initial-setup ubuntu-dock nautilus dbus-x11 ubuntu-wallpapers yaru-theme-gtk yaru-theme-icon htop curl unzip vlc || true
          
          wait
          sudo dpkg -i *.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f *.deb

          WALLPAPER=$(find /usr/share/backgrounds/ -name "*Jammy*" -o -name "*ubuntu*" | head -n 1)

          mkdir -p ~/.config
          echo "yes" > ~/.config/gnome-initial-setup-done

          sudo mkdir -p /etc/dconf/profile
          cat << 'EOF' | sudo tee /etc/dconf/profile/user > /dev/null
          user-db:user
          system-db:local
          EOF

          sudo mkdir -p /etc/dconf/db/local.d
          cat << 'EOF' | sudo tee /etc/dconf/db/local.d/00-wallpaper > /dev/null
          [org/gnome/desktop/background]
          picture-options='zoom'
          primary-color='#300A24'

          [org/gnome/desktop/interface]
          gtk-theme='Yaru-dark'
          color-scheme='prefer-dark'

          [org/gnome/shell]
          welcome-dialog-last-shown-version='9999'
          favorite-apps=['google-chrome.desktop', 'code.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Software.desktop', 'vlc.desktop']

          [org/gnome/shell/extensions/dash-to-dock]
          dock-position='LEFT'
          dash-max-icon-size=48
          always-show-dock=true
          autohide=false

          [org/gnome/shell]
          remember-mount-password=false
          disabled-extensions=@as []
          enabled-extensions=['ubuntu-dock@ubuntu.com']
          EOF

          sudo dconf update

          mkdir -p ~/.config/autostart
          cat << EOF > ~/.config/autostart/set-wallpaper.desktop
          [Desktop Entry]
          Type=Application
          Name=Set Wallpaper
          Exec=bash -c "sleep 5 && gsettings set org.gnome.desktop.background picture-uri 'file://${WALLPAPER}' && gsettings set org.gnome.desktop.background picture-uri-dark 'file://${WALLPAPER}' && gsettings set org.gnome.shell.extensions.dash-to-dock dock-position 'LEFT'"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF

          sudo bash -c 'echo "exec /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN" || true

      - name: Keep
        run: sleep 21600
        
