name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    steps:
      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          sudo systemctl stop gdm3 snapd || true
          sudo systemctl disable gdm3 snapd || true

          sudo apt-get update -qq

          sudo apt-get install -y -qq --no-install-recommends \
            gnome-session \
            gnome-shell \
            ubuntu-session \
            gnome-shell-extension-ubuntu-dock \
            yaru-theme-gtk \
            yaru-theme-icon \
            gnome-terminal \
            gnome-software \
            synaptic \
            screenfetch \
            xvfb \
            x11-xserver-utils \
            curl \
            unzip

          sudo mkdir -p /usr/share/backgrounds

          curl -sL "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -o vscode.deb &
          curl -sL "https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb" -o crd.deb &
          curl -sL "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" -o chrome.deb &
          sudo curl -sL "https://raw.githubusercontent.com/canonical/ubuntu-wallpapers/main/jammy/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png" -o /usr/share/backgrounds/jammy-wallpaper.png &
          wait

          sudo dpkg -i vscode.deb crd.deb chrome.deb || sudo apt-get install -f -y -qq
          rm -f vscode.deb crd.deb chrome.deb

          sudo bash -c 'echo "exec /usr/bin/gnome-session --session=ubuntu" > /etc/chrome-remote-desktop-session'

          mkdir -p ~/.config/dconf
          gsettings set org.gnome.desktop.background picture-uri 'file:///usr/share/backgrounds/jammy-wallpaper.png' || true
          gsettings set org.gnome.desktop.background picture-uri-dark 'file:///usr/share/backgrounds/jammy-wallpaper.png' || true
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' || true
          gsettings set org.gnome.desktop.interface gtk-theme 'Yaru-dark' || true
          gsettings set org.gnome.desktop.interface icon-theme 'Yaru' || true

          gsettings set org.gnome.shell enabled-extensions "['ubuntu-dock@ubuntu.com']" || true
          gsettings set org.gnome.shell.extensions.dash-to-dock dock-position 'LEFT' || true
          gsettings set org.gnome.shell.extensions.dash-to-dock extend-height true || true
          
          gsettings set org.gnome.shell favorite-apps "['org.gnome.Nautilus.desktop', 'google-chrome.desktop', 'code.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.Software.desktop']" || true

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"

      - name: Keep
        run: |
          sleep 21600
          
