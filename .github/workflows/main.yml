name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          
          sudo apt-get install -y -qq \
            gnome-session \
            gnome-shell \
            gnome-terminal \
            nautilus \
            dbus-x11 \
            rclone \
            htop \
            btop \
            curl \
            unzip \
            vlc \
            gimp \
            qbittorrent \
            gnome-software \
            yaru-theme-gtk \
            yaru-theme-icon
          
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg -i chrome-remote-desktop_current_amd64.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f chrome-remote-desktop_current_amd64.deb
          
          wget -q "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -O vscode.deb
          sudo dpkg -i vscode.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f vscode.deb
          
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f google-chrome-stable_current_amd64.deb

          sudo mkdir -p /usr/share/backgrounds
          sudo curl -sL "https://raw.githubusercontent.com/canonical/ubuntu-wallpapers/main/jammy/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png" -o /usr/share/backgrounds/jammy-wallpaper.png

          mkdir -p ~/.config/dconf/user.d/
          cat << 'EOF' > ~/.config/dconf/user.d/00-custom
          [org/gnome/desktop/background]
          picture-uri='file:///usr/share/backgrounds/jammy-wallpaper.png'
          picture-uri-dark='file:///usr/share/backgrounds/jammy-wallpaper.png'
          picture-options='zoom'

          [org/gnome/desktop/interface]
          gtk-theme='Yaru-dark'
          icon-theme='Yaru'
          color-scheme='prefer-dark'
          EOF
          
          dconf update || true

          sudo bash -c 'echo "exec /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'

      - name: Re-
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF
          
          rclone copy gdrive:CRD_Full_Backup/HomeDir /home/runner/ \
            --links \
            --transfers 8 \
            --checkers 16 \
            --tpslimit 12 \
            --fast-list \
            --drive-chunk-size 64M || true

          rm -rf ~/.dbus ~/.ICEauthority ~/.Xauthority ~/.cache ~/.local/share/trash
          rm -rf ~/.config/google-chrome/Singleton* ~/.config/google-chrome/Running*

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"
            
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true

      - name: Keep
        run: |
          sleep 19800

      - name: Back
        if: always()
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF
          
          rclone sync /home/runner/ gdrive:CRD_Full_Backup/HomeDir \
            --links \
            --transfers 8 \
            --checkers 16 \
            --tpslimit 12 \
            --fast-list \
            --drive-chunk-size 64M \
            --exclude ".config/rclone/**" \
            --exclude ".cache/**" \
            --exclude ".dbus/**" \
            --exclude ".local/share/trash/**" \
            --exclude ".ICEauthority" \
            --exclude ".Xauthority" \
            --exclude ".gnupg/**"
            
