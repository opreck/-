name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          echo "runner ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/runner-nopasswd
          
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb &
          wget -q "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -O vscode.deb &
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb &
          
          sudo apt-get update -qq
          
          sudo apt-get install -y -qq --no-install-recommends \
            ubuntu-desktop-minimal \
            gnome-shell-extension-ubuntu-dock \
            gnome-session \
            gnome-terminal \
            gnome-software \
            nautilus \
            dbus-x11 \
            yaru-theme-gtk \
            yaru-theme-icon \
            htop \
            curl \
            unzip \
            vlc || true
            
          wait
          sudo dpkg -i *.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f *.deb

          sudo mkdir -p /etc/dconf/profile
          sudo bash -c 'cat << "EOF" > /etc/dconf/profile/user
          user-db:user
          system-db:local
          EOF'

          sudo mkdir -p /etc/dconf/db/local.d
          sudo bash -c "cat << 'EOF' > /etc/dconf/db/local.d/01-desktop-dock
          [org/gnome/shell]
          favorite-apps=['google-chrome.desktop', 'code.desktop', 'org.gnome.Software.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.Nautilus.desktop']
          enabled-extensions=['ubuntu-dock@ubuntu.com']

          [org/gnome/shell/extensions/dash-to-dock]
          dock-position='LEFT'
          dash-max-icon-size=48
          dock-fixed=true
          always-visible=true

          [org/gnome/desktop/interface]
          gtk-theme='Yaru-dark'
          color-scheme='prefer-dark'
          EOF"

          sudo dconf update || true

          sudo bash -c 'echo "exec /usr/bin/gnome-session --session=ubuntu" > /etc/chrome-remote-desktop-session'

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN" || true
            
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true

      - name: Keep
        run: |
          sleep 21600
          
