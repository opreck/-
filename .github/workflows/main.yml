name: CI

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'code'
        required: true
        type: string
      pin:
        description: 'PIN'
        required: false
        default: '123456'
        type: string

jobs:
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    steps:
      - name: Setup Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          
          sudo apt-get install -y -qq \
            gnome-session \
            gnome-shell \
            gnome-terminal \
            nautilus \
            dbus-x11 \
            gnome-software \
            yaru-theme-gtk \
            yaru-theme-icon \
            curl \
            unzip
          
          sudo mkdir -p /usr/share/backgrounds
          
          curl -sL "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64" -o vscode.deb &
          curl -sL "https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb" -o crd.deb &
          curl -sL "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" -o chrome.deb &
          sudo curl -sL "https://raw.githubusercontent.com/canonical/ubuntu-wallpapers/main/jammy/Jammy-Jellyfish_WP_4096x2304_Ubuntu_Mascut.png" -o /usr/share/backgrounds/jammy-wallpaper.png &
          wait
          
          sudo dpkg -i vscode.deb crd.deb chrome.deb > /dev/null 2>&1 || sudo apt-get install -f -y -qq > /dev/null 2>&1
          rm -f vscode.deb crd.deb chrome.deb

          mkdir -p ~/.config/dconf/user.d/
          cat << 'EOF' > ~/.config/dconf/user.d/00-custom
          [org/gnome/desktop/background]
          picture-uri='file:///usr/share/backgrounds/jammy-wallpaper.png'
          picture-uri-dark='file:///usr/share/backgrounds/jammy-wallpaper.png'
          picture-options='zoom'

          [org/gnome/desktop/interface]
          gtk-theme='Yaru-dark'
          icon-theme='Yaru'
          color-scheme='prefer-dark'
          EOF
          
          dconf update || true

          sudo bash -c 'echo "exec /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'

      - name: Register
        run: |
          CODE="${{ inputs.auth_code }}"
          PIN="${{ inputs.pin }}"
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name=$(hostname) \
            --pin="$PIN"
            
          gsettings set org.gnome.desktop.session idle-delay 0 || true
          gsettings set org.gnome.desktop.screensaver lock-enabled false || true

      - name: Keep Alive (6 Hours+)
        run: |
          sleep 21600
          
